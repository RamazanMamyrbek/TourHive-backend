spring:
  datasource:
    url: jdbc:h2:mem:tourhive_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 1025

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-testing
  access-token-expiration-seconds: 900
  refresh-token-expiration-seconds: 2592000

logging:
  level:
    root: INFO
    com.tourhive.backend: DEBUG
