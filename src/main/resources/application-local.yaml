spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:tourhive_db}
    username: ${POSTGRES_USER:tourhive_user}
    password: ${POSTGRES_PASSWORD:tourhive_secret}
    driver-class-name: org.postgresql.Driver

logging:
  level:
    root: INFO
    com.tourhive.backend: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
